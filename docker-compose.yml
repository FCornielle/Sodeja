services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sodeja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sodeja_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sodeja}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sodeja_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sodeja} -d ${POSTGRES_DB:-sodeja}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sodeja_postgres_data:
